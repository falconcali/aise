# aise-server 配置文件
#
# 所有路径均相对启动时的工作目录（workspace 根）解析。
# 可通过环境变量 AISE_CONFIG 指定其它配置文件路径。
#
# 敏感信息（如 LLM API Key）请勿写入本文件；请使用环境变量

# 监听地址
listen_addr = "127.0.0.1:3000"

# 并发会话上限（R-ARCH-04）
max_sessions = 64

trace_dir = "trace"

# 前端静态资源目录；留空则使用 aise-server crate 内置的 assets/
# assets_dir = ""

[aise.llm]
base_url = "https://api.deepseek.com"
api_key = "env:DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"
max_concurrent = 4
temperature = 0.8
# deepseek-v4 系列默认开启 thinking 模式：思维链与最终答案共享 max_tokens
# 预算，且对 JSON 结构化输出不友好。显式禁用后直接返回 JSON，更稳定省钱。
thinking = "disabled"
# 在 trace 中记录完整的 LLM prompt 与返回内容，供调试 Trace 页签查看。
# 需配合环境变量 AISE_ENV=development（见 .env.example），否则校验失败。
trace_content = "full_content"

[aise.storage]
database_url = "data/aise.db"

[aise.turn]
max_repair_rounds = 3
# thinking 模式（deepseek-v4 系列默认开启）下，reasoning 与最终答案共享
# max_tokens 预算，预算太小会在 content 返回前被截断（finish_reason=length）。
max_tokens = 4096

[aise.assets]
max_key_bytes = 128
max_text_bytes = 32768
max_tags_per_item = 32
max_topics = 256
max_topic_aliases_per_topic = 16
max_entities_per_entry = 16
max_topics_per_entry = 16
