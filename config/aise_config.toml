max_profile_total_bytes = 65536
max_dialogue_examples_per_profile = 16
max_dialogue_situation_bytes = 1024
max_dialogue_response_bytes = 2048
max_role_background_bytes = 16384
max_world_facts = 512
max_world_rumors = 256
max_seed_memories_per_role = 32
max_relationships_per_role = 32
max_graph_nodes = 256
max_graph_edges = 512
max_condition_depth = 8
max_conditions_per_node = 16
max_effects_per_node = 16
max_manifest_bytes = 524288
max_compressed_pack_bytes = 33554432
max_uncompressed_pack_bytes = 134217728
max_compression_ratio = 64
max_asset_files = 1024
max_single_asset_bytes = 16777216
max_validation_issues = 64

