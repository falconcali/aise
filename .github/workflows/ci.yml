name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Domain dependency boundary
        shell: bash
        run: |
          violations="$(
            rg -n -U \
              '(?:crate|super(?:::\s*super)*)::\s*core\b|(?:crate|super)::\s*\{[^}]*\bcore(?:::|,|\})' \
              crates/aise/src/domain \
              --glob '*.rs' || true
          )"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Domain dependency boundary
        shell: bash
        run: |
          violations="$(
            rg -n -U \
              '(?:crate|super(?:::\s*super)*)::\s*core\b|(?:crate|super)::\s*\{[^}]*\bcore(?:::|,|\})' \
              crates/aise/src/domain \
              --glob '*.rs' || true
          )"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            exit 1
          fi
      - name: Format (MSRV)
        run: cargo +1.85 fmt --all --check
      - name: Clippy (MSRV, warnings as errors)
        run: cargo +1.85 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (MSRV)
        run: cargo +1.85 test --workspace --all-features
