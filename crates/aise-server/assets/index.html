<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISE — AI Story Engine</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>AISE</h1>
      <form id="new-session-form" autocomplete="off">
        <input id="session-name" placeholder="新故事名称" />
        <button type="submit">新建</button>
      </form>
      <ul id="session-list"></ul>
      <p id="sidebar-hint">选择或新建一个故事会话</p>
    </aside>
    <main id="stage">
      <div id="tabs">
        <button id="tab-story" class="tab active" type="button">故事</button>
        <button id="tab-trace" class="tab" type="button">调试 Trace</button>
      </div>
      <div id="story" class="tab-panel active"></div>
      <div id="trace-view" class="tab-panel">
        <div id="trace-empty">勾选“调试 Trace”以生成</div>
      </div>
      <form id="turn-form" autocomplete="off">
        <input id="player-input" placeholder="输入你的行动…" disabled />
        <label id="trace-toggle-label" title="开启后，每次 Turn 会把全链路调用信息（阶段、LLM Prompt、工具调用、LLM 返回等）返回到调试 Trace 页签">
          <input type="checkbox" id="trace-toggle" checked /> 调试 Trace
        </label>
        <button id="send-btn" type="submit" disabled>发送</button>
      </form>
    </main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
