slots:
  - slot_id: context.story_generator
    allowed_kinds: [text]
    required: true
  - slot_id: context.story_repairer
    allowed_kinds: [text]
    required: true
  - slot_id: context.writer_planner.csi
    allowed_kinds: [text]
    required: false
  - slot_id: context.writer_planner.rc
    allowed_kinds: [text]
    required: false
    vars:
      - { name: story_profile, var_type: string, required: true }
      - { name: instance_settings, var_type: string, required: true }
      - { name: story_summary, var_type: string, required: true }
      - { name: recent_story, var_type: string, required: true }
      - { name: current_scene, var_type: string, required: true }
      - { name: player_character, var_type: string, required: true }
      - { name: scene_characters, var_type: string, required: true }
      - { name: referenced_characters, var_type: string, required: true }
      - { name: relevant_knowledge, var_type: string, required: true }
      - { name: character_index, var_type: string, required: true }
      - { name: knowledge_entry_index, var_type: string, required: true }
      - { name: narrative_plan, var_type: string, required: true }
      - { name: active_story_constraints, var_type: string, required: true }
      - { name: player_input, var_type: string, required: true }
  - slot_id: context.writer_planner.fti
    allowed_kinds: [text]
    required: false
    vars:
      - { name: output_schema, var_type: string, required: true }
  - slot_id: context.character_think.csi
    allowed_kinds: [text]
    required: false
  - slot_id: context.character_think.rc
    allowed_kinds: [text]
    required: false
    vars:
      - { name: target_character, var_type: string, required: true }
      - { name: current_character_state, var_type: string, required: true }
      - { name: story_summary, var_type: string, required: true }
      - { name: recent_story, var_type: string, required: true }
      - { name: current_scene, var_type: string, required: true }
      - { name: relevant_character_knowledge, var_type: string, required: true }
      - { name: narrative_character_impulses, var_type: string, required: true }
      - { name: thinking_focus, var_type: string, required: true }
      - { name: player_input, var_type: string, required: true }
  - slot_id: context.character_think.fti
    allowed_kinds: [text]
    required: false
    vars:
      - { name: output_schema, var_type: string, required: true }
